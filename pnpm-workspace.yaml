packages:
  - 'packages/*'
  - 'apps/*'

# Supply-chain policy: third-party install scripts stay denied unless a work
# package explicitly approves them. These three arrive transitively (toolchain +
# Pi SDK). esbuild's platform binary already ships through its optional
# dependency — verified: `esbuild --version` reports 0.28.1 with every build
# script denied — and protobufjs / @google/genai are unused by delivered code.
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false
  # better-sqlite3 is the pinned project database (ARCHITECTURE.md §3). Its
  # install script fetches/compiles the native binding, so it must run; the
  # version is exact and the lockfile is committed.
  better-sqlite3: true

minimumReleaseAgeExclude:
  - '@types/node@22.20.2'
