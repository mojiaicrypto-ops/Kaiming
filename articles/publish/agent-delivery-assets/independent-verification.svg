<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780"><rect width="900" height="780" fill="#f1f6f4"/><g font-family='PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif'><text x="52" y="76" font-size="45" fill="#20312c" font-weight="600">全绿，也可能仍在自证</text><rect x="52" y="116" width="796" height="166" fill="#e2e9e6"/><text x="84" y="173" font-size="42" fill="#37554a" font-weight="600">实现输出  →  测试期望</text><text x="84" y="238" font-size="34" fill="#4b635a" font-weight="400">共享一个假设，彼此一致仍可能错。</text><text x="52" y="365" font-size="45" fill="#20312c" font-weight="600">让检查有机会推翻实现</text><rect x="52" y="405" width="796" height="96" fill="#137b66"/><text x="84" y="467" font-size="42" fill="#fff" font-weight="600">已确认验收 ＋ 独立数据</text><path d="M450 511V540" stroke="#137b66" stroke-width="7"/><path d="M437 528L450 545L463 528" fill="none" stroke="#137b66" stroke-width="7"/><text x="84" y="603" font-size="40" fill="#263532" font-weight="500">实际结果：是否满足要求？</text><text x="84" y="665" font-size="40" fill="#263532" font-weight="500">已知坏输入：能否正确拒绝？</text><text x="84" y="731" font-size="34" fill="#137b66" font-weight="600">拒绝原因要对，报错本身不够。</text></g></svg>